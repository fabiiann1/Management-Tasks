services:
  db:
    image: postgres:17
    restart: always
    env_file:
    - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw

  web:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - .:/app:rw
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
    - .env

volumes:
  postgres_data:
